<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="owner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arUp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" rx="16"/>

  <text x="48" y="60" fill="#ffffff" font-size="30" font-weight="800">Delegated Authority Model</text>
  <text x="48" y="92" fill="#94a3b8" font-size="17">Three tiers, explicit decision rights, one human at the top</text>
  <line x1="48" y1="112" x2="1152" y2="112" stroke="#1e293b" stroke-width="2"/>

  <!-- column headers -->
  <text x="1152" y="60" fill="#64748b" font-size="13" font-weight="700" text-anchor="end" letter-spacing="1.5">TARGET DECISION VOLUME</text>

  <!-- OWNER -->
  <rect x="360" y="146" width="480" height="72" rx="12" fill="url(#owner)"/>
  <text x="600" y="182" fill="#ffffff" font-size="21" font-weight="800" text-anchor="middle">OWNER — Human</text>
  <text x="600" y="205" fill="#ede9fe" font-size="14" text-anchor="middle">Final authority. Reviews; does not manage.</text>
  <text x="1152" y="190" fill="#a855f7" font-size="26" font-weight="800" text-anchor="end">1%</text>

  <line x1="600" y1="218" x2="600" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- CHIEF OF STAFF -->
  <rect x="360" y="258" width="480" height="66" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="600" y="290" fill="#e0e7ff" font-size="19" font-weight="700" text-anchor="middle">CHIEF OF STAFF AGENT</text>
  <text x="600" y="312" fill="#94a3b8" font-size="13.5" text-anchor="middle">Single human-facing interface. Consolidates all escalations.</text>

  <line x1="600" y1="324" x2="600" y2="364" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- TIER 2 -->
  <rect x="200" y="364" width="800" height="96" rx="12" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="228" y="394" fill="#c7d2fe" font-size="13" font-weight="700" letter-spacing="1.4">TIER 2 — EXECUTIVE OVERSIGHT</text>
  <text x="228" y="420" fill="#e2e8f0" font-size="15">Cross-entity governance. Activates only when a decision exceeds company authority.</text>
  <g font-size="12.5" fill="#94a3b8">
    <text x="228" y="444">CEO</text><text x="286" y="444">CFO</text><text x="344" y="444">COO</text>
    <text x="402" y="444">CTO</text><text x="460" y="444">CISO</text><text x="522" y="444">CMO</text>
    <text x="586" y="444">Architect</text>
  </g>
  <text x="1152" y="422" fill="#818cf8" font-size="26" font-weight="800" text-anchor="end">9%</text>

  <line x1="600" y1="460" x2="600" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- TIER 1 -->
  <rect x="80" y="500" width="985" height="128" rx="12" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="108" y="530" fill="#c7d2fe" font-size="13" font-weight="700" letter-spacing="1.4">TIER 1 — DOMAIN OPERATING AGENTS</text>
  <text x="108" y="556" fill="#e2e8f0" font-size="15">Full autonomy inside defined limits. Escalate only when a decision exceeds their authority.</text>
  <g>
    <rect x="108" y="572" width="218" height="38" rx="8" fill="#0f172a" stroke="#3f4d68"/>
    <text x="217" y="596" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Trading &amp; Investment Desks</text>
    <rect x="340" y="572" width="218" height="38" rx="8" fill="#0f172a" stroke="#3f4d68"/>
    <text x="449" y="596" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Marketing Studios</text>
    <rect x="572" y="572" width="218" height="38" rx="8" fill="#0f172a" stroke="#3f4d68"/>
    <text x="681" y="596" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Product &amp; Platform</text>
    <rect x="804" y="572" width="245" height="38" rx="8" fill="#0f172a" stroke="#3f4d68"/>
    <text x="926" y="596" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Intelligence &amp; Reporting</text>
  </g>
  <text x="1152" y="530" fill="#22c55e" font-size="26" font-weight="800" text-anchor="end">90%</text>

  <!-- escalation return path -->
  <path d="M 80 604 L 34 604 L 34 182 L 356 182" fill="none" stroke="#f59e0b" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#arUp)"/>
  <text x="46" y="400" fill="#f59e0b" font-size="12.5" font-weight="700"
        transform="rotate(-90 46 400)" text-anchor="middle">ESCALATION PATH</text>

  <!-- footer controls -->
  <line x1="48" y1="656" x2="1152" y2="656" stroke="#1e293b" stroke-width="2"/>
  <g font-size="13.5">
    <text x="48" y="684" fill="#64748b" font-weight="700">CONTROLS</text>
    <text x="140" y="684" fill="#94a3b8">Authority matrix per role</text>
    <text x="372" y="684" fill="#94a3b8">·  Founder lock on customer-facing output</text>
    <text x="716" y="684" fill="#94a3b8">·  Directory contract</text>
    <text x="892" y="684" fill="#94a3b8">·  Audited, versioned policy</text>
  </g>
  <text x="48" y="706" fill="#475569" font-size="12">Autonomy is granted by exception and never self-promoted — eligibility is measured by the system, but only the owner grants it.</text>
</svg>
